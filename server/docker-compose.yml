version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: chronograph_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT_OUTSIDE}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chronograph_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chronograph_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chronograph_network

volumes:
  postgres_data:

networks:
  chronograph_network:
    driver: bridge